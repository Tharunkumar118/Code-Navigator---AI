spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # 'validate' NEVER changes the schema. Schema changes in prod go through
      # migration tools (Flyway/Liquibase) added in a later hardening pass.
      ddl-auto: validate
    show-sql: false
    open-in-view: false

logging:
  level:
    root: WARN
    com.codenavigator.ai: INFO

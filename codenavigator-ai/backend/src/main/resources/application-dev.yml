spring:
  datasource:
    url: jdbc:mysql://localhost:3306/codenavigator_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:@Kumar118}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'update' is acceptable ONLY in dev: Hibernate auto-syncs the schema to match entities.
